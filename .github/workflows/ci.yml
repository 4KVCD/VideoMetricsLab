name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify required tools
        run: |
          ffmpeg -version
          python -c "from vmaf_app.core.ffmpeg_locate import check_tools; result = check_tools(); print(result); assert result.ok, result"
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint
        run: python -m ruff check vmaf_app tests
      - name: Tests
        run: python -X faulthandler -m pytest -q
