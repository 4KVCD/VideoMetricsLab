name: C++ port

# Builds the C++ port and runs its tests on Windows, Linux and macOS. The
# Linux sanitizer job finds memory errors and undefined behaviour that the
# other builds can pass over. On Windows the window and its tests are built
# too, with Qt (they are built where CMake finds Qt), and its tests run on
# Qt's offscreen platform; those that need a GPU or FFmpeg skip themselves.
on:
  push:
    branches: [cpp-port]
  pull_request:
    paths: ['cpp/**', '.github/workflows/cpp.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Visual Studio 2022: the compiler Qt 6.12 supports on Windows, and the
          # windows preset's (newer runner images have only Visual Studio 2026).
          - { name: Windows (MSVC 2022), os: windows-2022, configure: windows, build: windows-release }
          - { name: Linux (GCC 11), os: ubuntu-22.04, configure: linux, build: linux-release }
          - { name: Linux (GCC 13), os: ubuntu-24.04, configure: linux, build: linux-release }
          - { name: Linux sanitizers, os: ubuntu-24.04, configure: linux-sanitizers, build: linux-sanitizers-debug }
          - { name: macOS (Apple Clang), os: macos-15, configure: macos, build: macos-release }
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v6
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Qt (Windows)
        # Qt 6.12's MSVC 2022 build, as the app is developed with.
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.configure }}
      - name: Configure (with Qt)
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.configure }} "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
      - name: Build
        run: cmake --build --preset ${{ matrix.build }}
      - name: Test
        # The offscreen platform finds no fonts of its own on Windows.
        env:
          QT_QPA_FONTDIR: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts' || '' }}
        run: ctest --preset ${{ matrix.build }}
