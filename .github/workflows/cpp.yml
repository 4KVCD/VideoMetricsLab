name: C++ port

# Builds the C++ port and runs its tests on Windows, the window and its
# tests too, with Qt (they are built where CMake finds Qt), its tests on
# Qt's offscreen platform; those that need a GPU or FFmpeg skip themselves.
# The Linux sanitizer job finds memory errors and undefined behaviour in the
# engine, which Windows runs too, that the Windows build can pass over. The
# Linux (GCC 11, GCC 13) and macOS (Apple Clang) builds come back when the
# port reaches those systems.
#
# It runs only when asked (Actions > C++ port > Run workflow): at the end of
# each phase of the port, and before a release, both suites (unit and
# integration, cpp/tests/CMakeLists.txt). In between, the unit tests run on
# the development PC before each commit, GPU tests included, which GitHub's
# runners cannot run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Visual Studio 2022: the compiler Qt 6.12 supports on Windows, and the
          # windows preset's (newer runner images have only Visual Studio 2026).
          - { name: Windows (MSVC 2022), os: windows-2022, configure: windows, build: windows-release }
          - { name: Linux sanitizers, os: ubuntu-24.04, configure: linux-sanitizers, build: linux-sanitizers-debug }
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v6
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # Qt 6.12's MSVC 2022 build, as the app is developed with: qtbase, and
      # Qt's translations of its own dialogs, from Qt's own servers. Each
      # archive is checked against the SHA-1 Qt publishes beside it, and
      # unpacked with the runner's 7-Zip (Windows Server 2022's tar: "LZMA
      # codec is unsupported"). (aqtinstall, which install-qt-action runs,
      # cannot read Qt 6.12's repository: "Failed to locate XML data for Qt
      # version '6.12.0'".)
      - name: Cache Qt (Windows)
        if: runner.os == 'Windows'
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\Qt
          key: qt-6.12.0-0-202609280346-win64_msvc2022_64-qtbase-qttranslations
      - name: Install Qt (Windows)
        if: runner.os == 'Windows' && steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $repository = 'https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/qt6_6120_msvc2022_64/qt.qt6.6120.win64_msvc2022_64/6.12.0-0-202609280346'
          $qt = Join-Path $env:RUNNER_TEMP 'Qt'
          New-Item -ItemType Directory -Path $qt -Force | Out-Null
          foreach ($module in 'qtbase', 'qttranslations') {
              $url = "$repository$module-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z"
              $archive = Join-Path $env:RUNNER_TEMP "$module.7z"
              Invoke-WebRequest -Uri $url -OutFile $archive
              Invoke-WebRequest -Uri "$url.sha1" -OutFile "$archive.sha1"
              $expected = (Get-Content -Raw "$archive.sha1").Trim().Split(' ')[0]
              $actual = (Get-FileHash -Algorithm SHA1 $archive).Hash
              if ($actual -ne $expected) { throw "$module.7z: SHA-1 $actual, Qt publishes $expected" }
              7z x -y -bso0 -bsp0 "-o$qt" $archive
              if ($LASTEXITCODE -ne 0) { throw "$module.7z did not unpack" }
          }
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake --preset ${{ matrix.configure }}
      - name: Configure (with Qt)
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.configure }} "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP\Qt"
      - name: Build
        run: cmake --build --preset ${{ matrix.build }}
      - name: Test
        # The offscreen platform finds no fonts of its own on Windows.
        env:
          QT_QPA_FONTDIR: ${{ runner.os == 'Windows' && 'C:\Windows\Fonts' || '' }}
        run: ctest --preset ${{ matrix.build }}-all
