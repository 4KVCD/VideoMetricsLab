# Lint configuration for the repository's Python scripts. Run with:
#   ruff check scripts cpp/tests
line-length = 120
target-version = "py311"

[lint]
select = [
    "F",    # pyflakes: unused imports/names, real bugs
    "E9",   # syntax / IO errors
    "B",    # bugbear: likely-wrong constructs (mutable defaults, zip without strict, ...)
    "UP",   # pyupgrade: modern syntax for our target version
    "SIM",  # simplifiable code
    "I",    # import sorting
    "N",    # pep8-naming
    "RUF",
]
ignore = [
    "E501",    # line length is advisory here, not enforced
    "RUF001",  # we use real typographic characters (minus sign, ellipsis) in UI strings
]
