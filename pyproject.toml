[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# In parallel: one worker per core, at most 12 (a run took 36 s on one core and
# 10 s on 12 workers; more workers only add start-up). `-n 0` runs serially.
addopts = "-n auto --maxprocesses=12"
markers = [
    "packaging: checks the release build's file lists against the installed PySide6 and GStreamer wheels; slow, run with --packaging (CI and releases do)",
]

[tool.mypy]
# Type checking: python -m mypy. Lenient to begin with. Functions without
# annotations are not checked, and the modules below, which still have
# errors, are not checked at all. Fix a module, then take it off the list.
# Most of their errors are PySide6's short enum names (Qt.Checked rather
# than Qt.CheckState.Checked), which work but are not in its type stubs.
python_version = "3.11"
packages = ["vmaf_app"]
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "vmaf_app.cli",
    "vmaf_app.core.app_log",
    "vmaf_app.core.bitrate",
    "vmaf_app.core.d3d11_film_grain",
    "vmaf_app.core.ffprobe",
    "vmaf_app.core.film_grain",
    "vmaf_app.core.frame_sync_by_time",
    "vmaf_app.core.gpu_frames",
    "vmaf_app.core.gstreamer_playback",
    "vmaf_app.core.isolated",
    "vmaf_app.core.job_runner",
    "vmaf_app.core.metric_cache",
    "vmaf_app.core.metric_results",
    "vmaf_app.core.metrics",
    "vmaf_app.core.model_select",
    "vmaf_app.core.models",
    "vmaf_app.core.perceptual_cpu",
    "vmaf_app.core.perceptual_vship",
    "vmaf_app.core.run_io",
    "vmaf_app.core.stats",
    "vmaf_app.core.vmaf_cuda",
    "vmaf_app.core.vmaf_runner",
    "vmaf_app.core.vmaf_v1_gpu",
    "vmaf_app.core.vmaf_vulkan",
    "vmaf_app.main",
    "vmaf_app.ui.bitrate_panel",
    "vmaf_app.ui.bitrate_worker",
    "vmaf_app.ui.chart",
    "vmaf_app.ui.file_worker",
    "vmaf_app.ui.frame_compare_panel",
    "vmaf_app.ui.frame_extract_worker",
    "vmaf_app.ui.graph_panel",
    "vmaf_app.ui.main_window",
    "vmaf_app.ui.series_colors",
    "vmaf_app.ui.theme",
    "vmaf_app.ui.video_compare_view",
    "vmaf_app.ui.widgets",
    "vmaf_app.ui.zoom",
]
ignore_errors = true
